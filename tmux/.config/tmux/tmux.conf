## ==========================================
# Tmux Popup & Sessionx Styling for Gruvbox
# ==========================================
# Make tmux popups transparent and style the borders
set -g popup-style 'bg=default,fg=#ebdbb2'
set -g popup-border-style 'bg=default,fg=#504945'

# Pass Gruvbox colors to fzf inside tmux-sessionx
set -g @sessionx-fzf-opts '--color=bg+:#3c3836,bg:default,spinner:#8ec07c,hl:#83a598,fg:#ebdbb2,header:#83a598,info:#fabd2f,pointer:#8ec07c,marker:#8ec07c,fg+:#ebdbb2,prompt:#fb4934,hl+:#83a598'
