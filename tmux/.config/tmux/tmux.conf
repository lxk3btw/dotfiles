# Plugins
set -g @plugin 'tmux-plugins/tpm' # mandatory
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'omerxx/tmux-sessionx'

# Gruvbox Theme
set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark' # you can change this to 'light' if preferred

# set -g @plugin 'tmux-plugins/tmux-resurrect' # Persist tmux sessions after computer restart
# set -g @plugin 'tmux-plugins/tmux-continuum' # Save sessions every 15mins

# Mouse control
set -g mouse on

# Session managment
set -g @sessionx-bind 'o'

# Set up resurrect and continuum
# set -g @resurrect-capture-pane-contents "on"
# set -g @continuum-restore "on"

# Windows Index
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Shift Alt vim keys to switch windows 
bind -n M-H previous-window
bind -n M-L next-window

# Open panes in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Resize panes
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# Copy mode
unbind v
bind v copy-mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

# Status bar at top
set-option -g status-position top

# ==========================================
# Display Popups 
# ==========================================
bind C-g display-popup \
  -d "#{pane_current_path}" \
  -w 80% \
  -h 80% \
  -E "lazygit"

bind C-m display-popup \
  -w 80% \
  -h 80% \
  -E "rmpc"

# bind r to source tmux config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

