# Change the default Omarchy look'n'feel

# https://wiki.hyprland.org/Configuring/Variables/#general
general {

    layout = scrolling

    # No gaps between windows or borders
    # gaps_in = 0
    # gaps_out = 0
    # border_size = 0

    # For white felix
    gaps_in = 2.5
    gaps_out = 4
    border_size = 1
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    # --- OPACITY SETTINGS ---
    # 1.0 is opaque, 0.0 is invisible. 
    active_opacity = 0.90
    inactive_opacity = 0.90

    # Keeps fullscreen windows (like YouTube) fully opaque
    fullscreen_opacity = 1.0

    # Use round window corners (optional, looks better with transparency)
    # rounding = 0
    rounding = 10 # good rounded corners

    # --- BLUR SETTINGS ---
    # Essential for reading text on transparent backgrounds
    blur {
        enabled = true
        size = 5
        passes = 1
        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#layout
layout {
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1
}

# --- SPECIFIC RULES ---
# Disable Hyprland's global opacity specifically for Ghostty
windowrule = match:initial_class ^(com.mitchellh.ghostty)$, opacity 1.0 override 1.0 override
