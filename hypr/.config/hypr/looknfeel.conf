# Change the default Omarchy look'n'feel

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    # No gaps between windows or borders
    # gaps_in = 0
    # gaps_out = 0
    # border_size = 0
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    # --- OPACITY SETTINGS ---
    # 1.0 is opaque, 0.0 is invisible. 
    active_opacity = 0.9
    inactive_opacity = 0.85

    # Keeps fullscreen windows (like YouTube) fully opaque
    fullscreen_opacity = 1.0

    # Use round window corners (optional, looks better with transparency)
    # rounding = 0
    rounding = 10 # good rounded corners

    # --- BLUR SETTINGS ---
    # Essential for reading text on transparent backgrounds
    blur {
        enabled = true
        size = 5
        passes = 1
        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Dwindle-Layout/
dwindle {
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1
}

# --- SPECIFIC RULES ---
# If you want ONLY the browser to be transparent (and everything else opaque),
# remove the 'active_opacity' lines above and uncomment the lines below:

# windowrulev2 = opacity 0.9 0.9,class:^(firefox)$
# windowrulev2 = opacity 0.9 0.9,class:^(google-chrome)$
# windowrulev2 = opacity 0.9 0.9,class:^(brave-browser)$
