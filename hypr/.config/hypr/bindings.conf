# Application bindings
unbind = SUPER, T
bindd = SUPER, T, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" tmux new
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
unbind = SUPER, Y
bindd = SUPER, Y, Yazi (cwd), exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" yazi
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian -disable-gpu --enable-wayland-ime"

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"


# Unbind original app launcher and system utilities
unbind = SUPER, SPACE
unbind = SUPER ALT, SPACE
unbind = SUPER, D

# Bind new app launcher to Super + D
bindd = SUPER, D, App launcher, exec, omarchy-launch-walker

# Bind system utilities (Omarchy menu) to Super + Space
bindd = SUPER, SPACE, System Utilities, exec, omarchy-menu


# 1. Clear the defaults to avoid conflicts
unbind = SUPER, S
unbind = SUPER, J
unbind = SUPER, K
unbind = SUPER, L
unbind = SUPER SHIFT, LEFT
unbind = SUPER SHIFT, RIGHT
unbind = SUPER, O
unbind = SUPER CTRL, L
unbind = SUPER CTRL, H

# 2. Re-assign Focus to HJKL
bind = SUPER, H, movefocus, l
bind = SUPER, J, movefocus, d
bind = SUPER, K, movefocus, u
bind = SUPER, L, movefocus, r


# Switch hyprland layout (scrolling)
bindd = SUPER, O, Toggle workspace layout, exec, omarchy-hyprland-workspace-layout-toggle


# Move windows arround 
bindd = SUPER CTRL, H, Swap window to the left, swapwindow, l
bindd = SUPER CTRL, L, Swap window to the right, swapwindow, r   


# Lock system
bindd = SUPER SHIFT, L, Lock system, exec, omarchy-lock-screen

# 3. Re-assign the "Ejected" keys to S and D
bindd = SUPER, S, Toggle window split, layoutmsg, togglesplit

# Fixing workspace 10 issue
unbind = SUPER, code:19


